on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: pull
              working-directory: /opt/services/s3ntry
              run: git pull

            - name: lint/test
              working-directory: /opt/services/s3ntry/health
              run: |
                go vet ./...
                go test ./...

            - name: build
              working-directory: /opt/services/s3ntry/health
              run: go build -o s3ntry-health .

            - name: restart service
              run: systemctl --user restart s3ntry-health
