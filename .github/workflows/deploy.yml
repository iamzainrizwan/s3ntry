on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on:self-hosted
        steps:
            - name: lint/test
            working-directiory: health
            run: |
            go vet ./...
            go test ./...
            
            - name: deploy app
            working-directory: health
            run: go build -o /opt/services/s3ntry/health/s3ntry-health

            - name: restart service
            run: systemctl --user restart s3ntry-health
